name: CI

on: [push, workflow_dispatch]

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      with:
        version: 6.27.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: 16.x
        cache: 'pnpm'
    - run: pnpm i
    - run: node ./compress.mjs
    - name: Commit
      uses: stefanzweifel/git-auto-commit-action@v4.15.4
      with:
        commit_message: compress images
    - name: save sha
      id: ec_sha
      run: |
        echo "::set-output name=sha::$(git log -1 --format=format:"%H")"
    - name: Deploy Link
      uses: Sibz/github-status-action@v1
      with: 
        authToken: ${{secrets.GITHUB_TOKEN}}
        context: 'deploy'
        description: Deployed at https://preview.ec-nordbund.de/${{github.ref_name}}
        target_url: https://preview.ec-nordbund.de/${{github.ref_name}}
        state: 'success'
        sha: ${{steps.ec_sha.outputs.sha}}
  # Verwaltungs-Sync: überträgt Veranstaltungen aus dem CMS in die
  # Verwaltungs-DB und schreibt neu vergebene veranstaltungsIDs zurück.
  # Loop-Schutz: der Auto-Commit läuft mit GITHUB_TOKEN (triggert keine
  # neuen Workflow-Läufe); der [sync]-Guard ist die Zweitsicherung.
  sync:
    runs-on: ubuntu-latest
    needs: [ compress ]
    if: github.ref_name == 'main' && !startsWith(github.event.head_commit.message, '[sync]')
    steps:
      - uses: actions/checkout@v4
        with:
          # den evtl. frischen compress-Commit mitnehmen
          ref: main
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm i --ignore-scripts
      - name: Sync Veranstaltungen -> Verwaltung
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: node ./scripts/sync-veranstaltungen.mjs
      - name: Commit veranstaltungsIDs
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v4.15.4
        with:
          commit_message: '[sync] veranstaltungsIDs'
          file_pattern: 'content/veranstaltung/*.md'

  dispatch_main:
    runs-on: ubuntu-latest
    # erst NACH dem Sync dispatchen, damit der Website-Build die frisch
    # vergebenen veranstaltungsIDs enthält (sonst sendet die Anmeldung ID 0).
    # !cancelled(): auch bei geskipptem/rotem Sync deployen (Blog-Änderungen
    # sollen nicht an einem Veranstaltungs-Datenfehler hängen)
    needs: [ sync ]
    if:  github.ref_name == 'main' && !cancelled()
    steps:
      # Dispatch an `merge-content` event to the `target_repo`
      - name: Repository Dispatch
        env:
          target_repo: 'EC-Nordbund/EC-Website'
        # You may pin to the exact commit or the version.
        # uses: peter-evans/repository-dispatch@ce5485de42c9b2622d2ed064be479e8ed65e76f4
        uses: peter-evans/repository-dispatch@v2.1.0
        with:
          token: ${{ secrets.DISPATCH_HOOK_TOKEN }}
          repository: ${{ env.target_repo }}
          event-type: merge-content
          # client-payload: # optional, default is {}
  dispatch_push:
    runs-on: ubuntu-latest
    #needs: [ compress ]
    if:  github.ref_name != 'main'
    steps:
      # Dispatch an `merge-content` event to the `target_repo`
      - name: Repository Dispatch
        env:
          target_repo: 'EC-Nordbund/EC-Website'
        # You may pin to the exact commit or the version.
        # uses: peter-evans/repository-dispatch@ce5485de42c9b2622d2ed064be479e8ed65e76f4
        uses: peter-evans/repository-dispatch@v2.1.0
        with:
          token: ${{ secrets.DISPATCH_HOOK_TOKEN }}
          repository: ${{ env.target_repo }}
          event-type: preview-content
          client-payload: '{"branch": "${{github.ref_name}}"}'
